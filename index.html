
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8e9e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muckelchen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Muckelchens Bärchen-Countdown</title>
<style>
body{margin:0;padding:25px 18px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#70464b;background:linear-gradient(145deg,#f8e9e5,#fff5ec);text-align:center}
main{max-width:520px;margin:auto}
h1{font-size:32px}.bear{font-size:100px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile,.love{background:#ffffffd9;border-radius:18px;padding:15px 5px}
.num{display:block;font-size:27px;font-weight:bold;color:#b85e70}
.label{font-size:11px}
.date{margin:18px}
.love{padding:20px}
#message{font-size:20px;min-height:75px}
button{border:0;border-radius:30px;padding:15px;background:#b85e70;color:white;font-size:16px;width:100%;margin-top:12px}
.secondary{background:white;color:#b85e70}
.status{font-size:13px;margin-top:12px}
.note{font-size:12px;color:#92777a;margin-top:18px}
</style>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred=window.OneSignalDeferred||[];
window.OneSignalReady=new Promise((resolve,reject)=>{
  OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.init({
        appId:"bdcd129a-581f-4ec4-865c-7e76b26d910e",
        serviceWorkerPath:"/muckelchen-app/OneSignalSDKWorker.js",
        serviceWorkerParam:{scope:"/muckelchen-app/"}
      });
      resolve(OneSignal);
    }catch(e){console.error(e);reject(e);}
  });
});
</script>
</head>
<body>
<main>
<h1>Für mein Muckelchen ❤️</h1>
<div class="bear">🐻</div>
<h3>Bis dein Bärchen wieder bei dir ist …</h3>
<div class="tiles">
<div class="tile"><span class="num" id="days">00</span><span class="label">Tage</span></div>
<div class="tile"><span class="num" id="hours">00</span><span class="label">Stunden</span></div>
<div class="tile"><span class="num" id="minutes">00</span><span class="label">Minuten</span></div>
<div class="tile"><span class="num" id="seconds">00</span><span class="label">Sekunden</span></div>
</div>
<div class="date">15. November 2026 · 12:30 Uhr</div>
<section class="love">
<h3>💌 Eine Nachricht für dich</h3>
<div id="message">Mein Muckelchen, du bist mein schönster Gedanke. ❤️</div>
<button class="secondary" id="next">Noch eine Liebeserklärung 💗</button>
</section>
<button id="notify">Mitteilungen einschalten 🔔</button>
<div class="status" id="status"></div>
<p class="note">Dein Bärchen denkt an dich. Alle 30 Minuten eine neue Liebesbotschaft! ❤️</p>
</main>
<script>
const reunion=new Date(2026,10,15,12,30,0);
const notes=[
"Mein Muckelchen, du bist mein schönster Gedanke. ❤️",
"Ein Bärchen vermisst sein Muckelchen ganz doll. 🐻",
"Auch wenn wir gerade nicht zusammen sind: Mein Herz ist bei dir.",
"Ich würde dich jetzt am liebsten ganz fest knuddeln.",
"Du bist mein Lieblingsmensch – heute, morgen und für immer.",
"Jede Minute bringt mich meinem Muckelchen näher. 💕",
"Eine ganz große Bärenumarmung nur für dich!",
"Du machst selbst gewöhnliche Tage wunderschön.",
"Ich schicke dir tausend Küsse und eine extra große Umarmung.",
"Muckelchen, du fehlst mir. Ich freue mich auf dich.",
"Du bist mein Zuhause-Gefühl.",
"Für dich hat mein Herz immer einen extra großen Platz.",
"Bärchen denkt an dich. Jetzt und immer.",
"Ich kann es kaum erwarten, dich wieder in die Arme zu schließen.",
"Wenn ich an dich denke, muss ich einfach lächeln. ❤️"
];
let index=0;
const $=id=>document.getElementById(id);
function update(){
 let t=Math.max(0,Math.floor((reunion-Date.now())/1000));
 $("days").textContent=Math.floor(t/86400);
 $("hours").textContent=String(Math.floor(t%86400/3600)).padStart(2,"0");
 $("minutes").textContent=String(Math.floor(t%3600/60)).padStart(2,"0");
 $("seconds").textContent=String(t%60).padStart(2,"0");
 if(t===0)$("message").textContent="Dein Bärchen ist da! Jetzt wird geknuddelt! 🐻❤️";
}
function next(){index=(index+1)%notes.length;$("message").textContent=notes[index];}
$("next").onclick=next;
update();setInterval(update,1000);
setInterval(next,30*60*1000);

$("notify").onclick=async()=>{
 $("status").textContent="OneSignal wird verbunden …";
 try{
  const os=await window.OneSignalReady;
  if(!os.Notifications.isPushSupported()){
   $("status").textContent="Push wird nicht unterstützt. Bitte die installierte App auf dem Home-Bildschirm öffnen.";
   return;
  }
  await os.Notifications.requestPermission();
  $("status").textContent=os.Notifications.permission
   ?"Mitteilungsberechtigung ist aktiv. ❤️"
   :"Bitte erlaube die Mitteilungen in den iPhone-Einstellungen.";
 }catch(e){
  $("status").textContent="OneSignal konnte nicht starten. Bitte Internetverbindung und Service Worker prüfen.";
 }
};
</script>
</body>
</html>
